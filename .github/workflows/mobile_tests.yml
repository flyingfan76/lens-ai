name: Mobile Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile_tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile_tests.yml'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        flutter-version: ['3.16.0', '3.19.0']
        test-suite: ['unit', 'integration', 'widget']
      fail-fast: false

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.flutter-version }}
        channel: 'stable'
        cache: true

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          mobile/.dart_tool
          mobile/build
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ matrix.flutter-version }}-${{ hashFiles('mobile/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-${{ matrix.flutter-version }}-
          ${{ runner.os }}-flutter-

    - name: Install dependencies
      run: flutter pub get

    - name: Verify Flutter setup
      run: flutter doctor -v

    - name: Analyze code
      run: flutter analyze --fatal-infos --fatal-warnings

    - name: Check code formatting
      run: dart format --output=none --set-exit-if-changed lib test

    - name: Run unit tests
      if: matrix.test-suite == 'unit'
      run: |
        flutter test \
          --coverage \
          --reporter=github \
          test/services/ \
          test/core/ \
          test/providers/ \
          test/utils/ \
          test/fixtures/ \
          test/mocks/

    - name: Run integration tests
      if: matrix.test-suite == 'integration'
      run: |
        flutter test \
          --coverage \
          --reporter=github \
          test/integration/

    - name: Run widget tests
      if: matrix.test-suite == 'widget'
      run: |
        flutter test \
          --coverage \
          --reporter=github \
          test/screens/ \
          test/widgets/

    - name: Upload coverage to Codecov
      if: matrix.flutter-version == '3.19.0'
      uses: codecov/codecov-action@v3
      with:
        file: mobile/coverage/lcov.info
        flags: mobile,${{ matrix.test-suite }}
        name: mobile-${{ matrix.test-suite }}-coverage
        fail_ci_if_error: false

    - name: Generate test report
      if: always()
      run: |
        mkdir -p test-results
        dart run test_runner.dart --suite="${{ matrix.test-suite }}" --reporter=json > test-results/results.json || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.flutter-version }}-${{ matrix.test-suite }}
        path: mobile/test-results/
        retention-days: 30

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run performance tests
      run: |
        flutter test \
          --reporter=github \
          test/benchmarks/ \
          test/core/state/performance_tests.dart

    - name: Generate performance report
      run: |
        dart run test_runner.dart --suite="Performance" --reporter=json

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: mobile/test-results/
        retention-days: 90

  e2e:
    name: End-to-End Tests
    runs-on: macos-latest
    timeout-minutes: 60
    needs: test
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Setup iOS Simulator
      run: |
        xcrun simctl list
        xcrun simctl create test_device "iPhone 15" "iOS17.0"
        xcrun simctl boot test_device

    - name: Run E2E tests
      run: |
        flutter test integration_test/ \
          --reporter=github \
          -d test_device

    - name: Upload E2E results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-results
        path: mobile/test-results/
        retention-days: 30

  error-handling:
    name: Error Handling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run error handling tests
      run: |
        flutter test \
          --coverage \
          --reporter=github \
          test/error_handling/

    - name: Upload error handling results
      uses: actions/upload-artifact@v3
      with:
        name: error-handling-results
        path: mobile/test-results/
        retention-days: 30

  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [test, error-handling]
    if: always()

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Install lcov
      run: sudo apt-get install -y lcov

    - name: Run all tests with coverage
      run: |
        dart run test_runner.dart --coverage --critical-only

    - name: Generate HTML coverage report
      run: |
        genhtml coverage/lcov.info -o coverage/html --title "Lens AI Mobile Coverage"

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: mobile/coverage/html/
        retention-days: 30

    - name: Coverage summary
      run: |
        lcov --summary coverage/lcov.info

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        build-mode: ['debug', 'profile', 'release']
        platform: ['android', 'web']
      fail-fast: false

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Setup Java
      if: matrix.platform == 'android'
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Android APK
      if: matrix.platform == 'android'
      run: |
        flutter build apk --${{ matrix.build-mode }} --target-platform android-arm64

    - name: Build Web
      if: matrix.platform == 'web'
      run: |
        flutter build web --${{ matrix.build-mode }}

    - name: Upload build artifacts
      if: matrix.build-mode == 'release'
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.platform }}-${{ matrix.build-mode }}
        path: |
          mobile/build/app/outputs/flutter-apk/app-release.apk
          mobile/build/web/
        retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run dependency audit
      run: |
        flutter pub deps --json > deps.json
        # Check for known vulnerabilities in dependencies
        cat deps.json

    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: mobile/
        base: main
        head: HEAD

    - name: Upload security results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: mobile/deps.json
        retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, performance, e2e, error-handling, coverage-report]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate test summary
      run: |
        echo "# 🧪 Lens AI Mobile Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Suite Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Process test results from artifacts
        if [ -d "test-results-3.19.0-unit" ]; then
          echo "✅ Unit Tests: Completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Unit Tests: Failed or not run" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "test-results-3.19.0-integration" ]; then
          echo "✅ Integration Tests: Completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Integration Tests: Failed or not run" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "test-results-3.19.0-widget" ]; then
          echo "✅ Widget Tests: Completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Widget Tests: Failed or not run" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "performance-results" ]; then
          echo "✅ Performance Tests: Completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⏭️ Performance Tests: Skipped" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "e2e-results" ]; then
          echo "✅ E2E Tests: Completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⏭️ E2E Tests: Skipped" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "coverage-report" ]; then
          echo "📊 Coverage report generated and uploaded" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Verification" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Build verification completed for Android and Web platforms" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "🤖 Generated by GitHub Actions" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: always() && (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Notify on success
      if: needs.test-summary.result == 'success'
      run: |
        echo "✅ All mobile tests passed successfully!"
        # Add notification logic here (Slack, Discord, email, etc.)

    - name: Notify on failure
      if: needs.test-summary.result == 'failure'
      run: |
        echo "❌ Some mobile tests failed!"
        # Add notification logic here (Slack, Discord, email, etc.)
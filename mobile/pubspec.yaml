name: lens_ai
description: Lens AI - AI-powered mobile camera control and photography assistant
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # Camera & Image processing
  camera: ^0.10.5+9
  image: ^4.1.4
  
  # AI & ML (Local processing only)
  tflite_flutter: ^0.10.4
  
  # UI Components
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  
  # Device & Platform
  device_info_plus: ^9.1.1
  permission_handler: ^11.2.0
  
  # Security & Privacy
  crypto: ^3.0.3
  encrypt: ^5.0.1
  local_auth: ^2.1.6
  flutter_secure_storage: ^9.0.0
  pointycastle: ^3.7.3
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  path: ^1.8.3
  
  # Network dependencies (for AI provider integration)
  http: ^1.1.2
  # connectivity_plus: ^5.0.2  # Temporarily disabled due to network issues
  
  # External Camera Support
  network_info_plus: ^4.1.0  # For WiFi camera discovery
  udp: ^5.0.3  # For camera network protocols
  web_socket_channel: ^2.4.0  # For camera websocket communication
  
  # Still removed - not needed for AI provider workflow:
  # dio: ^5.4.0 - Simple http package sufficient
  # cached_network_image: ^3.3.0 - No network image loading needed

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  
  # Testing dependencies
  mockito: ^5.4.4
  fake_async: ^1.3.1
  clock: ^1.1.1
  test: ^1.24.9
  integration_test:
    sdk: flutter
  patrol: ^3.2.1
  golden_toolkit: ^0.15.0
  network_image_mock: ^2.1.1
  
  # Code coverage
  coverage: ^1.7.1
  
  # Performance testing
  benchmark_harness: ^2.2.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/animations/
  
  # fonts:
    # - family: Roboto
    #   fonts:
    #     - asset: assets/fonts/Roboto-Regular.ttf
    #     - asset: assets/fonts/Roboto-Bold.ttf
    #       weight: 700